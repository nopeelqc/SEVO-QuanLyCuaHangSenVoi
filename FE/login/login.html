<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - SEVO Cửa Hàng Sen Vòi</title>
    <link rel="icon" type="image/png" href="../asset/logo.png">
    <link rel="preload" as="image" href="../asset/logo.png">
    <link rel="preload" as="image" href="../asset/avt.png">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="man_hinh_xac_thuc" id="man_hinh_xac_thuc">
    <video autoplay loop muted playsinline preload="metadata" disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback" class="video_nen" id="video_nen">
        <source src="../asset/background.mp4" type="video/mp4">
    </video>
    <div class="lop_phu_video" id="lop_phu_video"></div>

    <div class="thanh_dieu_huong_dau">
        <div class="hop_logo_dau">
            <img src="../asset/logo.png" alt="Logo" class="anh_logo_dau" width="60" height="60" decoding="async" fetchpriority="high">
            <span class="chu_logo_dau">SEVO</span>
        </div>
        <div class="cum_nut_dau">
            <button type="button" class="nut_dieu_huong" id="nut_mo_dang_nhap">Đăng Nhập</button>
            <button type="button" class="nut_dieu_huong" id="nut_mo_dang_ky">Đăng Ký</button>
        </div>
    </div>

    <div class="noi_dung_gioi_thieu" id="noi_dung_gioi_thieu">
        <h1>KHÔNG GIAN CỦA SỰ TINH TẾ</h1>
        <p>Hệ thống quản lý cửa hàng thiết bị vệ sinh và sen vòi cao cấp SEVO</p>
    </div>

    <div class="khung_xac_thuc" id="khung_xac_thuc">
        <button type="button" class="nut_dong_popup" id="nut_dong_popup">&times;</button>
        <div class="dau_xac_thuc">
            <img src="../asset/logo.png" alt="Logo" class="logo_xac_thuc" width="42" height="42" decoding="async">
            <h2>SEVO</h2>
        </div>

        <form id="bieu_mau_dang_nhap" class="bieu_mau dang_hien">
            <h3>Đăng nhập</h3>
            <div class="nhom_nhap">
                <label for="ten_dang_nhap">Tên đăng nhập hoặc Email</label>
                <input type="text" id="ten_dang_nhap" required placeholder="Nhập tài khoản">
            </div>
            <div class="nhom_nhap">
                <label for="mat_khau_dang_nhap">Mật khẩu</label>
                <input type="password" id="mat_khau_dang_nhap" required placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" class="nut_xac_thuc">Đăng nhập</button>
            <p class="chuyen_doi_bieu_mau">
                Chưa có tài khoản? <span id="chuyen_sang_dang_ky">Đăng ký ngay</span>
            </p>
        </form>

        <form id="bieu_mau_dang_ky" class="bieu_mau">
            <h3>Đăng ký tài khoản</h3>
            <div class="nhom_nhap">
                <label for="ho_ten_dang_ky">Họ và tên</label>
                <input type="text" id="ho_ten_dang_ky" required placeholder="Nhập họ và tên">
            </div>
            <div class="nhom_nhap">
                <label for="email_dang_ky">Email</label>
                <input type="email" id="email_dang_ky" required placeholder="Nhập email">
            </div>
            <div class="nhom_nhap">
                <label for="mat_khau_dang_ky">Mật khẩu</label>
                <input type="password" id="mat_khau_dang_ky" required placeholder="Tạo mật khẩu">
            </div>
            <div class="nhom_nhap">
                <label for="xac_nhan_mat_khau">Xác nhận mật khẩu</label>
                <input type="password" id="xac_nhan_mat_khau" required placeholder="Nhập lại mật khẩu">
            </div>
            <button type="submit" class="nut_xac_thuc">Đăng ký</button>
            <p class="chuyen_doi_bieu_mau">
                Đã có tài khoản? <span id="chuyen_sang_dang_nhap">Đăng nhập</span>
            </p>
        </form>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>

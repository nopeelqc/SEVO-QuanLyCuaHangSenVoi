<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>SEVO - Cửa Hàng Sen Vòi</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<div class="thanh_ben" id="thanh_ben">
    <div class="dau_thanh_ben">
        <div class="chua_logo" id="chua_logo">
            <img src="logo.png" alt="Logo" class="anh_logo">
            <div class="mui_ten_mo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
            <span class="chu_logo">SEVO</span>
        </div>
        <div class="mui_ten_dong" id="nut_thu_gon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </div>
    </div>

    <div class="danh_sach_menu">

        </a>
        <a href="#" class="muc_menu" data-tieude="Sản phẩm & Danh mục">
            <div class="bieu_tuong">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>

        </a>
        <a href="#" class="muc_menu" data-tieude="Quản lý Khách hàng">

        </a>
        <a href="#" class="muc_menu" data-tieude="Bán hàng & Hóa đơn">
            <div class="bieu_tuong">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>

            <div class="bieu_tuong">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16v-2"></path><polyline points="3.29 7 12 12 20.71 7"></polyline><line x1="12" y1="22" x2="12" y2="12"></line></svg>

            </div>
            <span class="chu_thich">Quản lý Tài khoản</span>
        </a>
    </div>
</div>

<div class="noi_dung_chinh">
    <h1>Hệ thống Quản lý Bán hàng Cửa hàng Sen Vòi</h1>
    <p>Chọn một chức năng trên thanh menu bên trái để tiếp tục.</p>
